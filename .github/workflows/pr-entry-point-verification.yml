name: Whirlwind PR entry-point verification
on:
  push:
    branches: ['codex/pr-merge-verification-20261125']
    paths: ['.github/workflows/pr-entry-point-verification.yml']
permissions:
  contents: read
jobs:
  entry-point:
    name: "Integrated candidate ${{ matrix.pr }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 80
            sha: bc3329ed95100915812590ca014b5298404975e0
            tree: 8536b970a8098e12dd4a9e61fcf44255ab8cf04f
          - pr: 52
            sha: 5bbe9ce86cdb181e260d1bbd882b3cb8a68d17a8
            tree: 8cc4b55701742c996d4a69b69848b38a9b785496
          - pr: 76
            sha: 6a16061673ef38651f293d116f9a9aead7a9011a
            tree: 27ac2e610b927ca7f51d0dde911eec2613d20812
          - pr: 75
            sha: 74d826b6b0970ca183b8f45ebf6985e7b009162c
            tree: 16c769aa295eda1dca6cc259224f3feaa8792513
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tree and run relevant entry point
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
          PR: ${{ matrix.pr }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          case "$PR" in
            80)
              go test -mod=readonly -race -v -count=1 ./internal/verification -run '^(TestResolveJobCommand.*|TestOfflineDockerManagedManifestPinsPolicyAndImage)$'
              ;;
            52)
              go test -mod=readonly -race -v -count=1 ./internal/verification ./internal/workflow -run '^(TestQltyStagingSeparatesUnchangedOnboardingFromCandidateDiff|TestQltyOnboardingBaselineEvidenceIsNotCandidateFindingCoverage|TestProjectSetupAcceptsOnlyCompletedQltyBaselineFindings|TestDefaultQualityApprovalFreezesQltyAndSecretConfiguration)$'
              ;;
            76|75)
              go build -mod=readonly ./cmd/whirlwind ./cmd/whirlwind-dashboard ./cmd/whirlwind-verify
              export WHIRLWIND_TEST_SEEDED_PTY=1
              if [ "$PR" = 76 ]; then
                go test -mod=readonly -race -v -count=1 -timeout=8m ./cmd/whirlwind -run '^TestProjectMemoryThroughLauncher$'
              else
                go test -mod=readonly -race -v -count=1 -timeout=8m ./cmd/whirlwind -run '^(TestSeededHumanWorkflowThroughPTY|TestProjectMemoryThroughLauncher)$'
              fi
              ;;
            *) exit 2 ;;
          esac
