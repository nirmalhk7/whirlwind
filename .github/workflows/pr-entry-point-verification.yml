name: Whirlwind PR entry-point verification
on:
  push:
    branches: ['codex/pr-merge-verification-20261125']
    paths: ['.github/workflows/pr-entry-point-verification.yml']
permissions:
  contents: read
jobs:
  entry-point:
    name: "Port ${{ matrix.pr }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 16
            sha: 0c78fdf6497dc9cefbcda674268fd09dc66f5a3a
            tree: 231ef1197230c544433795fb6f0f52c980dda37b
            tests: TestSeededHumanWorkflowThroughPTY
          - pr: 18
            sha: 05bf75ac330b5223fd6dd449ee528dbcec0a2e9c
            tree: 79579d16e02227d81a82228f6ce48ff2a724784b
            tests: TestRoleQueueHTTPThroughLauncher|TestSeededHumanWorkflowThroughPTY
    env:
      GOTOOLCHAIN: local
      WHIRLWIND_TEST_SEEDED_PTY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Match candidate tree and exercise the shipped entry points
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
          FIXTURES: ${{ matrix.tests }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          go build -mod=readonly ./cmd/whirlwind ./cmd/whirlwind-dashboard ./cmd/whirlwind-verify
          go test -mod=readonly -race -v -count=1 -timeout=8m ./cmd/whirlwind -run "^($FIXTURES)$"
