name: Whirlwind PR entry-point verification
on:
  push:
    branches: ['codex/pr-merge-verification-20261125']
    paths: ['.github/workflows/pr-entry-point-verification.yml']
permissions:
  contents: read
jobs:
  entry-point:
    name: "Port ${{ matrix.pr }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 82
            sha: 9169eba8fff4d2d4ae5a12577825d38a952e8c2a
            tree: 6dbc894c48734984cdcd25d7cb3593f9aa5137f3
            tests: TestSeededHumanWorkflowThroughPTY
    env:
      GOTOOLCHAIN: local
      WHIRLWIND_TEST_SEEDED_PTY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Match candidate tree and exercise the shipped entry points
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
          FIXTURES: ${{ matrix.tests }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          go build -mod=readonly ./cmd/whirlwind ./cmd/whirlwind-dashboard ./cmd/whirlwind-verify
          go test -mod=readonly -race -v -count=1 -timeout=8m ./cmd/whirlwind -run "^($FIXTURES)$"
